[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurex"
version = "0.1.0"
description = "Risk-first trading research and execution platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
  "websockets>=16,<17",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "duckdb==1.3.2",
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["My-Krypt-Trader"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
